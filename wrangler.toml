name = "zerog-fasting-tracker"
main = "dist/index.js" # Modern wrangler uses 'main' instead of [build.upload]
compatibility_date = "2024-09-19"

[build]
command = "npm run build"

# --- DEFAULT / LOCAL SETTINGS ---
# This applies when running `wrangler dev`
[[d1_databases]]
binding = "DB"
database_name = "zerog_db"
database_id = "LOCAL"

[vars]
ENVIRONMENT = "development"

# --- PRODUCTION SETTINGS ---
# This applies when running `wrangler deploy --env production`
[env.production]
name = "zerog-fasting-tracker-prod"
routes = [
  { pattern = "zerog.fasting.opentuwa.com/*", zone_name = "fasting.opentuwa.com" }
]

[[env.production.d1_databases]]
binding = "DB"
database_name = "zerog_db"
database_id = "d4fd103b-90c2-457d-a801-d3f315fc57ef"

[env.production.vars]
ENVIRONMENT = "production"